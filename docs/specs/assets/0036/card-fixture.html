<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>0036 ProviderCard refresh fixture</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; padding: 32px; }
  .card { width: 320px; background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .name { font-weight: 600; font-size: 15px; }
  .status { color: #52c41a; font-size: 12px; }
  .row { display: flex; gap: 8px; font-size: 13px; margin: 6px 0; color: #555; }
  .label { color: #999; min-width: 72px; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; border-top: 1px solid #f0f0f0; padding-top: 12px; }
  .btns { display: flex; gap: 4px; }
  button { border: none; background: transparent; cursor: pointer; padding: 6px; border-radius: 6px; }
  button:hover { background: #f5f5f5; }
  button.primary-refresh { color: #1677ff; }
  .toast { margin-top: 16px; background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 360px; display: none; }
  body.after .toast { display: block; }
  body.after .models-count { color: #1677ff; font-weight: 600; }
</style>
</head>
<body class="before">
  <div class="card" data-testid="provider-card">
    <div class="header">
      <span class="name">OpenAI</span>
      <span class="status">● 已授权</span>
    </div>
    <div class="row"><span class="label">Base URL:</span><span>https://api.openai.com/v1</span></div>
    <div class="row"><span class="label">API Key:</span><span>sk-t••••••••est</span></div>
    <div class="row"><span class="label">模型:</span><span class="models-count" id="models">2 个模型</span></div>
    <div class="actions">
      <span>启用</span>
      <div class="btns">
        <button class="primary-refresh" data-testid="provider-refresh-models" title="更新模型">↻</button>
        <button title="测试">⚡</button>
        <button title="设置">✎</button>
        <button title="删除">🗑</button>
      </div>
    </div>
  </div>
  <div class="toast" data-testid="refresh-toast">OpenAI 已更新：新增 3 个（来源 remote+preset）</div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('state') === 'after') {
      document.body.className = 'after';
      document.getElementById('models').textContent = '5 个模型';
    }
  </script>
</body>
</html>
